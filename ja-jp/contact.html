<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ & サポート - Hunter Disk Cleaner</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --bg-color: #0F1522;
            --card-bg: #161F32;
            --accent-color: #2CE4D1;
            --text-main: #FFFFFF;
            --text-muted: #8A929E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 18px;
        }

        h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        p.description {
            color: var(--text-muted);
            font-size: 1rem;
        }

        form, .status-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(44, 228, 209, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .status-box {
            display: none;
            text-align: center;
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(15, 21, 34, 0.6);
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s ease;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(44, 228, 209, 0.2);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #24bdaf;
            box-shadow: 0 0 15px rgba(44, 228, 209, 0.4);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="/App.png" alt="Hunter Disk Cleaner Logo" class="logo">
        <h1>お問い合わせ & サポート</h1>
        <p class="description">ご質問、テクニカルサポートの依頼、または提携に関するお話がございましたら、以下のフォームよりメッセージをお送りください。</p>
    </header>

    <form id="contactForm" onsubmit="submitContactForm(event)">
        <div class="form-group">
            <label for="name">お名前</label>
            <input type="text" id="name" placeholder="例：山田 太郎" required>
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="purpose">お問い合わせ種別</label>
            <select id="purpose" required>
                <option value="Technical Support">テクニカルサポート / バグ報告</option>
                <option value="Commercial Inquiry">ビジネス提携 / 企業様のお問い合わせ</option>
                <option value="General Question">一般的なご質問</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">メッセージ</label>
            <textarea id="notes" placeholder="詳細な内容やフィードバックをご記入ください..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">メッセージを送信</button>
    </form>

    <div id="successBox" class="status-box">
        <h2 style="color: var(--accent-color); margin-bottom: 15px;">✓ 送信が完了しました！</h2>
        <p style="color: #E2E8F0; margin-bottom: 20px;">お問い合わせいただきありがとうございます。メッセージは Hunter Disk Cleaner サポートチームへ直接送信されました。確認のうえ、迅速にご返信いたします。</p>
        <a href="index.html" class="btn-submit" style="display: inline-block; text-align: center; text-decoration: none; width: auto; padding: 10px 30px;">ホームに戻る</a>
    </div>

    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
async function submitContactForm(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const contactForm = document.getElementById('contactForm');
    const successBox = document.getElementById('successBox');
    
    submitBtn.disabled = true;
    submitBtn.innerText = "送信中...";

    const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        hwid: "N/A",
        purpose: document.getElementById('purpose').value,
        notes: document.getElementById('notes').value
    };

    const workerUrl = "https://hunter-form-pro.geandertkind.workers.dev";

    try {
        const response = await fetch(workerUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            contactForm.style.display = 'none';
            successBox.style.display = 'block';
        } else {
            alert("エラーが発生しました。時間を置いて再度お試しください。");
            submitBtn.disabled = false;
            submitBtn.innerText = "メッセージを送信";
        }
    } catch (error) {
        alert("ネットワークエラーが発生しました。サポートサーバーに接続できません。");
        submitBtn.disabled = false;
        submitBtn.innerText = "メッセージを送信";
    }
}
</script>

</body>
</html>
